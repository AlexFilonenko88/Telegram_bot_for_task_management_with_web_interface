# =============================================================================
# docker-compose.yml — production-деплой TaskBot API с PostgreSQL.
#
# Запуск (из папки taskbot/):
#   docker compose up -d --build
# Остановка (данные БД остаются в томе pgdata):
#   docker compose down
#
# Секреты и параметры берутся из .env в корне репозитория (env_file: ../.env):
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD — креды PostgreSQL,
#   DATABASE_URL — строка подключения приложения (хост БД = имя сервиса "db"),
#   BOT_SECRET — секрет авторизации бота в API.
# =============================================================================

services:

  # --- Приложение: FastAPI (образ собирается из нашего Dockerfile) -----------
  app:
    # Имя образа совпадает с тем, что пушит GitHub Actions (п.16):
    #   - локально `docker compose build` тегирует собранное этим именем;
    #   - на сервере `docker compose pull app` скачивает образ из ghcr.io
    #     (имя в GHCR — только строчными буквами).
    image: ghcr.io/alexfilonenko88/taskbot-api:latest
    build:
      context: .              # контекст — taskbot/ (backend + frontend/static)
      dockerfile: Dockerfile
    container_name: taskbot-app
    # Секреты передаются в контейнер файлом .env (BOT_SECRET, DATABASE_URL...).
    env_file:
      - ../.env
    # Порт наружу: дашборд http://localhost:8000, Swagger /docs
    ports:
      - "8000:8000"
    # restart: always — контейнер поднимается заново после падения
    # и автоматически при старте демона Docker (перезагрузка сервера).
    restart: always
    # app стартует только когда БД реально готова принимать подключения:
    # depends_on с condition: service_healthy ждёт зелёный healthcheck у db
    # (простого depends_on недостаточно — он ждёт лишь запуск контейнера).
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tasknet

  # --- База данных: PostgreSQL 15 --------------------------------------------
  db:
    image: postgres:15
    container_name: taskbot-db
    # Образ postgres сам читает POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    # из окружения — они приходят из ../.env через env_file.
    env_file:
      - ../.env
    # Персистентность: данные живут в именованном томе pgdata, а не в слое
    # контейнера — переживают пересоздание контейнера и docker compose down.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # HEALTHCHECK: pg_isready проверяет готовность СУБД принимать подключения.
    # $${...} — экранированный $: переменные раскрываются ВНУТРИ контейнера db
    # (где POSTGRES_USER/POSTGRES_DB уже установлены из env_file),
    # а не при парсинге compose-файла.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-taskbot} -d $${POSTGRES_DB:-taskbot}"]
      interval: 5s        # проверка каждые 5 секунд
      timeout: 5s         # ответ дольше 5с = проверка не пройдена
      retries: 10         # 10 неудач подряд => unhealthy
      start_period: 10s   # время на первичную инициализацию кластера БД
    restart: always
    networks:
      - tasknet

  # --- Loki: хранилище логов (п.17) -------------------------------------------
  # Все контейнеры присылают сюда логи через Promtail; просмотр — в Grafana.
  loki:
    image: grafana/loki:3.4.2
    container_name: taskbot-loki
    # Конфиг монтируется read-only (:ro) — контейнер не может его изменить.
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki           # чанки и индексы переживают пересоздание
    # Порт 3100 наружу НЕ публикуем: Loki доступен только из сети tasknet.
    restart: always
    networks:
      - tasknet

  # --- Promtail: агент сбора логов контейнеров (п.17) ---------------------------
  # Через docker.sock находит все контейнеры и читает их лог-файлы,
  # через сеть tasknet отправляет в Loki.
  promtail:
    image: grafana/promtail:3.4.2
    container_name: taskbot-promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Docker API: service discovery контейнеров
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Лог-файлы контейнеров: Promtail читает их напрямую с диска хоста
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: always
    networks:
      - tasknet

  # --- Grafana: веб-интерфейс для просмотра логов (п.17) -------------------------
  # http://localhost:3000 (логин/пароль admin/admin — сменить после входа).
  grafana:
    image: grafana/grafana:11.5.2
    container_name: taskbot-grafana
    ports:
      - "3000:3000"
    volumes:
      # Datasources Loki (п.17) и Prometheus (п.18) подключаются автоматически
      # при первом старте: вся папка provisioning смонтирована в Grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana  # дашборды и настройки переживают рестарт
    depends_on:
      - loki
    restart: always
    networks:
      - tasknet

  # --- Prometheus: сбор и хранение метрик (п.18) --------------------------------
  # Опрашивает node-exporter каждые 15с (monitoring/prometheus.yml),
  # данные в volume prometheus-data — переживают перезапуск.
  # Порт 9090 наружу не публикуем: доступ к данным — через Grafana.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: taskbot-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: always
    networks:
      - tasknet

  # --- node-exporter: метрики самого сервера (п.18) ------------------------------
  # Отдаёт CPU/RAM/диск/сеть хоста на http://node-exporter:9100/metrics.
  # Монтирует /proc, /sys и / хоста ТОЛЬКО НА ЧТЕНИЕ — это официальный
  # способ node-exporter видеть реальные ресурсы машины из контейнера.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: taskbot-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    # Пути внутри контейнера, куда смонтированы файловые системы хоста
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    restart: always
    networks:
      - tasknet

# --- Именованные сущности ------------------------------------------------------

volumes:
  pgdata:     # том с данными PostgreSQL
  loki-data:  # том с логами Loki
  grafana-data: # том с данными Grafana
  prometheus-data: # том с метриками Prometheus (п.18)

networks:
  tasknet:  # общая сеть: app видит db по имени сервиса "db", promtail -> loki
    driver: bridge
