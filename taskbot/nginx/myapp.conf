# =============================================================================
# Nginx: reverse proxy для production-деплоя TaskBot.
#
# Домен:      myapp.com  (заменить на свой во ВСЕХ местах файла)
# Приложение: FastAPI в Docker, слушает localhost:8000 (docker-compose, п.13)
#
# Установка файла:
#   sudo cp myapp.conf /etc/nginx/sites-available/myapp.conf
#   sudo ln -s /etc/nginx/sites-available/myapp.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # убрать дефолтный сайт
#   sudo nginx -t && sudo systemctl reload nginx
#
# ВАЖНО про порядок запуска с Certbot (см. nginx/SETUP.md):
#   1) Первый раз включите ТОЛЬКО http-блок (80), получите сертификат:
#        sudo certbot certonly --webroot -w /var/www/certbot -d myapp.com
#   2) Затем раскомментируйте https-блок и reload. Пока сертификата нет,
#      nginx с ssl-блоком не стартует — поэтому 443 выключен по умолчанию.
#
# Файл кладётся в sites-available => он включается ВНУТРИ http-контекста,
# поэтому директивы http-уровня (limit_req_zone, gzip) разрешены здесь же.
# =============================================================================

# --- Rate limiting (лимиты запросов) ------------------------------------------
# Зона на 10 МБ отслеживает IP-адреса (~160k адресов) и разрешает в среднем
# 10 запросов/сек на IP; очередь (burst) до 20 запросов без ошибки, излишек
# отбрасывается с 429 без очереди лишних ожиданий (nodelay).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Отдельная зона для логина/письма бота: там брутфорс-атаки наиболее вероятны.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

# map для WebSocket: если клиент прислал заголовок Upgrade — в Connection
# уходит "upgrade", иначе пусто (обычные HTTP-запросы работают как раньше).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name myapp.com www.myapp.com;

    # --- Место под сертификаты Certbot ----------------------------------------
    # Certbot (режим webroot) кладёт сюда валидационные файлы:
    #   sudo certbot certonly --webroot -w /var/www/certbot -d myapp.com
    # Let's Encrypt запрашивает http://myapp.com/.well-known/acme-challenge/<token>,
    # nginx отдаёт файлы прямо из файловой системы — без проксирования в app.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # --- Редирект HTTP -> HTTPS ------------------------------------------------
    # Все остальные HTTP-запросы навсегда (301 — кэшируется браузерами)
    # перенаправляются на HTTPS. $request_uri сохраняет путь и query-параметры:
    # http://myapp.com/tasks?page=2 -> https://myapp.com/tasks?page=2
    location / {
        return 301 https://myapp.com$request_uri;
    }
}

