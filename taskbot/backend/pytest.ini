# Конфигурация pytest (используется локально и в CI, п.16).
# pythonpath: добавить каталог с pytest.ini (taskbot/backend) в sys.path —
# без этого `from app.main import app` в тестах падает с ModuleNotFoundError:
# pytest кладёт в sys.path каталог тестов, а не рабочую директорию.
[pytest]
pythonpath = .
testpaths = tests
