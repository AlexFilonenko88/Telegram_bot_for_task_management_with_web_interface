# =============================================================================
# GitHub Actions: CI/CD — автодеплой FastAPI на VPS при push в master.
#
# Пайплайн (3 джобы, каждая стартует только после успешной предыдущей):
#   1. test            — pytest прогоняет тесты бэкенда (гейт качества);
#   2. build-and-push  — собирает Docker-образ и пушит в GitHub Container
#                        Registry (ghcr.io);
#   3. deploy          — подключается к серверу по SSH и обновляет приложение:
#                        docker compose pull + up --force-recreate,
#                        затем проверяет healthcheck.
#
# Триггер: push в master. В задании указана ветка main, но основная ветка
# этого репозитория — master (см. git branch --show-current). Для ручного
# запуска добавлен workflow_dispatch (кнопка Run workflow в Actions).
#
# Секреты репозитория (Settings -> Secrets and variables -> Actions):
#   SSH_HOST         — IP/домен VPS;
#   SSH_USER         — пользователь на VPS (например, deploy);
#   SSH_PRIVATE_KEY  — приватный ключ (публичный добавлен в authorized_keys);
#   SSH_PORT         — порт SSH (обычно 22);
#   GHCR_TOKEN       — PAT с правом read:packages, чтобы сервер мог
#                      выполнить docker login ghcr.io и скачать приватный образ.
# GITHUB_TOKEN — встроенный, отдельный секрет не нужен (используется для
# пуша образа, права выдаёт блок permissions).
#
# Серверный путь приложения: /home/deploy/myapp — структура как в репозитории:
#   /home/deploy/myapp/.env            — секреты (читается compose через env_file: ../.env)
#   /home/deploy/myapp/taskbot/docker-compose.yml
# =============================================================================

name: Deploy

on:
  push:
    branches: [master]        # основная ветка репозитория (в задании: main)
  workflow_dispatch:          # ручной запуск из UI Actions

# Права GITHUB_TOKEN: пакеты push — чтобы залить образ в ghcr.io.
permissions:
  contents: read
  packages: write

# Одновременные деплои запрещены: два пуша подряд не должны драться за сервер.
concurrency:
  group: deploy-production
  cancel-in-progress: false   # новый деплоей дождётся очереди, а не убьёт текущий

jobs:

  # --- 1. Тесты: pytest бэкенда ------------------------------------------------
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskbot/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"     # как в Dockerfile
          cache: pip                 # кэш pip между запусками

      - name: Установка зависимостей
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Тесты pytest
        run: pytest tests/ -v

  # --- 2. Сборка и публикация образа в ghcr.io ----------------------------------
  build-and-push:
    needs: test                      # образ собираем, только если тесты зелёные
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Логин в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и push образа
        uses: docker/build-push-action@v6
        with:
          context: ./taskbot         # Dockerfile ожидает контекст taskbot/
          file: ./taskbot/Dockerfile
          push: true
          # Имя образа в ghcr.io — только строчными буквами, поэтому хардкод
          # (github.repository_owner содержит заглавные: AlexFilonenko88).
          # Два тега: latest — для compose pull на сервере; sha — версия для отката.
          tags: |
            ghcr.io/alexfilonenko88/taskbot-api:latest
            ghcr.io/alexfilonenko88/taskbot-api:${{ github.sha }}
          cache-from: type=gha       # кэш слоёв сборки между запусками
          cache-to: type=gha,mode=max

  # --- 3. Деплой на VPS ----------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      # Приложение на сервере: docker-compose.yml лежит здесь,
      # .env — на уровень выше (env_file: ../.env в compose).
      APP_DIR: /home/deploy/myapp/taskbot
    steps:
      # Секреты НЕЛЬЗЯ читать в if на уровне джобы (GitHub отклоняет файл),
      # поэтому пропускаем деплой через шаг-проверку: пока secrets не заданы,
      # остальные шаги помечаются skipped и пайплайн остаётся зелёным.
      # После добавления секретов (Settings -> Secrets and variables -> Actions)
      # деплой включится сам на следующем push в master.
      - name: Проверка секретов деплоя
        id: secrets_check
        # Секреты передаются в env шага — так их можно читать в shell.
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          missing=""
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_PORT GHCR_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "Деплой на VPS пропущен — не заданы секреты:$missing."
            echo "Добавьте их в Settings -> Secrets and variables -> Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # Приватный ключ из секрета -> временный файл с правами 600
      # (ssh отказывается работать с ключом, доступным группе/всем).
      - name: Настройка SSH-ключа
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Логин в ghcr.io на сервере
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=accept-new \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              'echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin'

      - name: Pull и перезапуск контейнеров
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=accept-new \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "cd $APP_DIR \
                && docker compose pull app \
                && docker compose up -d --force-recreate"

      - name: Проверка healthcheck после деплоя
        if: steps.secrets_check.outputs.ready == 'true'
        # Приложение поднимается не мгновенно (миграции, инициализация БД):
        # до 12 попыток раз в 5 секунд (60 сек суммарно).
        # curl -fsS — неуспешный HTTP-код => ненулевой exit => step упадёт,
        # и деплой будет помечен как неудачным, а не "тихо зелёным".
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=accept-new \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              'for i in $(seq 1 12); do
                 if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
                   echo "Приложение отвечает (попытка $i)"; exit 0;
                 fi
                 echo "Попытка $i: приложение ещё не готово, ждём 5с..."; sleep 5;
               done
               echo "HEALTHCHECK FAILED: приложение не ответило за 60 секунд" >&2
               docker logs --tail 50 taskbot-app
               exit 1'
